name: Feature request
description: Suggest a workflow or protocol improvement
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow, not only the UI control you want.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Imports / protocols
        - Routing and rules
        - Chain proxy
        - Export and validation
        - Desktop app
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: The proposal respects safe mode (no writes to Clash Verge, no kernel reload).
          required: true
