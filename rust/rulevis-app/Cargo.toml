[package]
name = "rulevis-app"
version = "0.1.0"
edition = "2021"
description = "Desktop application logic for Clash RuleVis, independent of the Tauri shell."
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rulevis-core = { path = "../rulevis-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
similar = "2"
uuid = { version = "1", features = ["v4"] }
